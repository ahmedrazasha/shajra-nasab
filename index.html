<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>شجرہ نسب بنانے کا جدید ٹول</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: 'Jameel Noori Nastaleeq';
  src: local('Jameel Noori Nastaleeq'), local('Jameel Noori Nastaliq');
}

:root {
  --font-urdu: 'Jameel Noori Nastaleeq', 'Noto Nastaliq Urdu', serif;
  --bg: #eef3f0;
  --cd: #ffffff;
  --ink: #14221c;
  --mu: #596e64;
  --ac: #0d6849;
  --ln: #cbd7d0;
  --in: #f7faf8;
  --boy: #1976d2;
  --boy-bg: #eaf2fc;
  --girl: #c2185b;
  --girl-bg: #fdebf2;
  --spouse: #7b1fa2;
  --spouse-bg: #f5eaf9;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-urdu);
  font-size: 16px;
  line-height: 2;
}

input, select, button {
  font-family: var(--font-urdu);
}

.app {
  display: grid;
  grid-template-columns: minmax(350px, 480px) 1fr;
  gap: 16px;
  padding: 14px;
  align-items: start;
}
@media(max-width: 1050px) {
  .app { grid-template-columns: 1fr; }
}

.ui { min-width: 0; }
.bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}
button {
  font-size: 15px;
  border: 1px solid var(--ln);
  background: var(--cd);
  color: var(--ink);
  border-radius: 8px;
  padding: 5px 12px;
  cursor: pointer;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
button:hover { background: #e2ebe6; }
button.pr {
  background: var(--ac);
  color: #fff;
  border-color: var(--ac);
  font-weight: bold;
}
button.pr:hover { background: #094e36; }

.cd {
  background: var(--cd);
  border: 1px solid var(--ln);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.04);
}
.cd h3 {
  margin: 0 0 10px;
  font-size: 18px;
  color: var(--ac);
  border-bottom: 1px dashed var(--ln);
  padding-bottom: 4px;
}

input, select {
  font-size: 15px;
  background: var(--in);
  color: var(--ink);
  border: 1.5px solid var(--ln);
  border-radius: 8px;
  padding: 4px 10px;
  height: 40px;
  min-width: 0;
}
input:focus, select:focus {
  outline: none;
  border-color: var(--ac);
  background: #fff;
}
.r {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 6px 0;
  flex-wrap: wrap;
}
.r input.n { flex: 1 1 140px; }

/* Cards */
.p {
  border: 1.5px solid #d2ded7;
  background: #fafcfb;
  border-radius: 10px;
  padding: 10px;
  margin: 8px 0;
}
.p.m { border-right: 4px solid var(--boy); }
.p.f { border-right: 4px solid var(--girl); }

.kids {
  margin-inline-start: 14px;
  padding-inline-start: 10px;
  border-inline-start: 2px dashed #b8ccc2;
}

.sp {
  background: var(--spouse-bg);
  border: 1px solid #e1bee7;
  border-radius: 8px;
  padding: 6px 10px;
}

.x {
  color: #c62828;
  background: #ffebee;
  border-color: #ffcdd2;
  padding: 2px 8px;
  border-radius: 6px;
}
.x:hover { background: #ef9a9a; }

.hd2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.hd2 label {
  display: flex;
  flex-direction: column;
  font-size: 14px;
  color: var(--mu);
}

.pv {
  overflow: auto;
  min-width: 0;
  background: #d8e2dc;
  padding: 20px;
  border-radius: 12px;
}
#sheet {
  background: #fff;
  color: #000;
  width: 8.5in;
  min-height: 14in;
  padding: 0.35in 0.45in;
  box-sizing: border-box;
  box-shadow: 0 4px 18px rgba(0,0,0,0.15);
  margin: 0 auto;
  position: relative;
}

/* ایک ہی سطر میں عمودی سینٹر ہیڈنگ */
.single-heading-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-start;
  gap: 28px;
  font-family: var(--sf);
  font-size: var(--fs, 18px);
  line-height: 2.2;
  margin-bottom: 25px;
}
.single-heading-row .item {
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
}

#tw svg { display: block; margin: 0 auto; }
svg path { fill: none; stroke: #000; stroke-width: 2; stroke-linejoin: round; }
.nm { font-family: var(--sf); font-size: var(--fs); font-weight: normal !important; }

/* گواہان و تصدیق کنندگان سیکشن (بولڈ بالکل ختم) */
.witness-box {
  width: 380px;
  margin-top: 30px;
  margin-right: 25px;
  margin-left: auto;
  font-family: var(--sf);
}
.wit-row {
  margin-bottom: var(--wgap, 30px);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}
.wit-top {
  display: flex;
  align-items: baseline;
  gap: 12px;
  width: 100%;
}
.wit-name {
  font-size: var(--fs, 18px);
  font-weight: normal !important;
  white-space: nowrap;
  line-height: 1.8;
}
.wit-role {
  font-size: calc(var(--fs, 18px) - 3px);
  font-weight: normal !important;
  color: #222;
  white-space: nowrap;
}
.wit-underline {
  width: 175px;
  border-bottom: 1.5px solid #000;
  margin-top: 2px;
  margin-bottom: 3px;
}
.wit-cnic {
  font-family: Arial, sans-serif;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 0.5px;
  direction: ltr;
  text-align: right;
  width: 175px;
}

button.add-boy {
  background: var(--boy-bg);
  color: var(--boy);
  border-color: #bbdefb;
  font-size: 14px;
}
button.add-girl {
  background: var(--girl-bg);
  color: var(--girl);
  border-color: #f8bbd0;
  font-size: 14px;
}
button.add-sp {
  background: var(--spouse-bg);
  color: var(--spouse);
  border-color: #e1bee7;
  font-size: 14px;
}
button.mv { padding: 2px 8px; font-size: 13px; }
.tip { margin: 4px 0 8px; font-size: 13px; color: var(--mu); }

@page { size: 8.5in 14in; margin: .25in; }
@media print {
  body { background: #fff; }
  .ui { display: none !important; }
  .app { display: block; padding: 0; }
  .pv { overflow: visible; background: transparent; padding: 0; }
  #sheet {
    box-shadow: none;
    margin: 0;
    padding: 0.1in;
    width: 8in;
    height: 13.5in;
  }
}
</style>
</head>
<body>

<div class="app">
  <div class="ui">
    <div class="bar">
      <button class="pr" id="pr">🖨 پرنٹ شجرہ (Legal)</button>
      <button id="ex">📄 نمونہ (مثال)</button>
      <button id="nw">✨ نیا شجرہ</button>
    </div>
    <div id="ed"></div>
  </div>

  <div class="pv">
    <div id="sheet"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = t => String(t || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const P = (g='m') => ({n:'', g, sp:[], ch:[]});
const K = (n, g, sp=[]) => ({n, g, sp, ch:[]});

const SAMPLE = () => ({
  H: { mz: 'چک نمبر 155 ٹی', vn: '840', gn: 'علی رضا', rel: 'بیٹا', sh: 1, bl: 1, font: 'j', fs: '18', wgap: '30' },
  R: {
    n: 'غلام محمد', g: 'm', fa: 'اسلم', mo: 'خادمہ',
    sp: [],
    ch: [
      K('زویا', 'f'),
      { n: 'فاطمہ', g: 'f', sp: [{n: 'صادق'}], ch: [] },
      { n: 'رمشا', g: 'f', sp: [{n: 'صادق'}], ch: [] },
      K('وقاص', 'm'),
      K('جیون علی', 'm'),
      K('علی نواز', 'm'),
      K('مہتاب احمد', 'm')
    ]
  },
  W: [
    { n: 'علی رضا ولد علی نواز قوم', c: '31304-1768719-9', r: 'یکے از وارثان' },
    { n: 'علی رضا ولد علی نواز', c: '31304-1768719-9', r: 'گواہ' },
    { n: 'علی رضا ولد علی نواز', c: '31304-1768719-9', r: 'نمبردار دیہہ' }
  ]
});

const BLANK = () => ({
  H: { mz: '', vn: '', gn: '', rel: 'بیٹا', sh: 1, bl: 1, font: 'j', fs: '18', wgap: '30' },
  R: { ...P('m'), fa: '', mo: '' },
  W: [
    { n: '', c: '', r: 'یکے از وارثان' },
    { n: '', c: '', r: 'گواہ' },
    { n: '', c: '', r: 'نمبردار دیہہ' }
  ]
});

let S;
try { S = JSON.parse(localStorage.getItem('shajra_v8')) } catch(e){}
if (!S || !S.R) S = SAMPLE();
if (!S.W) S.W = SAMPLE().W;
if (!S.H.wgap) S.H.wgap = '30';

function el(t, a={}, ...k) {
  const e = document.createElement(t);
  for (const [x, v] of Object.entries(a)) {
    if (x === 'on') {
      for (const [ev, f] of Object.entries(v)) e.addEventListener(ev, f);
    } else if (x in e) e[x] = v;
    else e.setAttribute(x, v);
  }
  k.flat().forEach(c => c && e.append(c));
  return e;
}

const RELS = ['بیٹا', 'بیٹی', 'زوجہ', 'بیوہ', 'شوہر', 'بھائی', 'بہن', 'والد', 'والدہ', 'پوتا', 'پوتی', 'نواسہ', 'نواسی', 'بھتیجا', 'بھتیجی'];
let FOCUS = null;

const inp = (o, k, ph, c) => {
  const e = el('input', {
    className: c || 'n',
    value: o[k] || '',
    placeholder: ph,
    on: { input: ev => { o[k] = ev.target.value; upd(); } }
  });
  if (o === FOCUS) { FOCUS = null; setTimeout(() => e.focus(), 0); }
  return e;
};
const btn = (t, f, c) => el('button', { className: c || '', type: 'button', on: { click: f } }, t);
const lab = (t, i) => el('label', {}, t, i);

function card(p, root, arr) {
  const m = p.g === 'm', i = arr ? arr.indexOf(p) : 0;
  const mv = d => {
    const j = i + d;
    if (j < 0 || j >= arr.length) return;
    [arr[i], arr[j]] = [arr[j], arr[i]];
    build();
  };

  const add = g => {
    const c = P(g);
    p.ch.unshift(c);
    FOCUS = c;
    build();
  };

  const g = el('select', { on: { change: e => { p.g = e.target.value; build(); } } },
    el('option', { value: 'm' }, root ? '👤 متوفی (مرد)' : '👦 بیٹا'),
    el('option', { value: 'f' }, root ? '👩 متوفیہ (عورت)' : '👧 بیٹی')
  );
  g.value = p.g;

  return el('div', { className: 'p ' + p.g },
    el('div', { className: 'r' },
      g,
      inp(p, 'n', root ? 'متوفی / متوفیہ کا نام' : 'نام وارث'),
      root ? '' : [
        btn('▲', () => mv(-1), 'mv'),
        btn('▼', () => mv(1), 'mv'),
        btn('🗑 ہٹائیں', () => { arr.splice(i, 1); build(); }, 'x')
      ]
    ),
    root ? el('div', { className: 'r' },
      inp(p, 'fa', 'والد کا نام (اوپر والا درجہ)'),
      inp(p, 'mo', 'والدہ کا نام')
    ) : '',
    p.sp.map((s, spIdx) => el('div', { className: 'r sp' },
      el('span', { style: 'font-weight:bold;color:var(--spouse);' }, m ? `💍 زوجہ ${spIdx+1}:` : '💍 شوہر:'),
      inp(s, 'n', m ? 'نام زوجہ' : 'نام شوہر'),
      btn('🗑', () => { p.sp.splice(p.sp.indexOf(s), 1); build(); }, 'x')
    )),
    el('div', { className: 'r', style: 'margin-top:8px;' },
      btn('＋ بیٹا شامل کریں', () => add('m'), 'add-boy'),
      btn('＋ بیٹی شامل کریں', () => add('f'), 'add-girl'),
      btn(m ? '＋ زوجہ شامل کریں' : '＋ شوہر شامل کریں', () => {
        const s = { n: '' };
        p.sp.push(s);
        FOCUS = s;
        build();
      }, 'add-sp')
    ),
    p.ch.length ? el('div', { className: 'kids' }, p.ch.map(c => card(c, 0, p.ch))) : ''
  );
}

function witnessCard() {
  return el('div', { className: 'cd' },
    el('h3', {}, '✍️ گواہان و تصدیق کنندگان (دستخط و انگوٹھا)'),
    el('div', { className: 'r', style: 'margin-bottom:10px;' },
      lab('گواہان کے درمیان فاصلہ (گیپ پکسل)', inp(S.H, 'wgap', '30', 'n'))
    ),
    S.W.map((w, idx) => el('div', { className: 'r', style: 'border-bottom:1px dashed var(--ln);padding-bottom:6px;margin-bottom:6px;' },
      inp(w, 'n', 'نام ولدیت قوم (مثلاً: علی رضا ولد علی نواز قوم)', 'n'),
      inp(w, 'c', 'شناختی کارڈ نمبر', 'n'),
      inp(w, 'r', 'حیثیت (یکے از وارثان/گواہ)', 'n'),
      btn('🗑', () => { S.W.splice(idx, 1); build(); }, 'x')
    )),
    btn('＋ نیا گواہ / تصدیق کنندہ شامل کریں', () => {
      S.W.push({ n: '', c: '', r: 'گواہ' });
      build();
    }, 'add-sp')
  );
}

function build() {
  const H = S.H;
  const sel = (k, opts, def) => {
    const s = el('select', { on: { change: e => { H[k] = e.target.value; upd(); } } },
      opts.map(([v, t]) => el('option', { value: v }, t))
    );
    s.value = H[k] || def;
    return s;
  };

  const fontSizes = [14, 16, 18, 20, 22, 24, 26, 28, 30, 32, 34, 36, 38, 40].map(x => [String(x), String(x) + ' px']);

  $('#ed').replaceChildren(
    el('div', { className: 'cd' },
      el('h3', {}, '📋 بنیادی معلومات'),
      el('div', { className: 'hd2' },
        lab('وراثت نمبر', inp(H, 'vn', 'مثلاً: 840')),
        lab('موضع / چک نمبر', inp(H, 'mz', 'مثلاً: چک نمبر 155 ٹی')),
        lab('حسب گفتہ (نام بیان کنندہ)', inp(H, 'gn', 'مثلاً: علی رضا')),
        lab('رشتہ بیان کنندہ', sel('rel', RELS.map(r => [r, r]), 'بیٹا'))
      ),
      el('div', { className: 'r', style: 'margin-top:10px;' },
        lab('', el('span', {},
          el('input', { type: 'checkbox', checked: !!H.sh, on: { change: e => { H.sh = e.target.checked; upd(); } } }),
          ' ہیڈنگ پرنٹ کریں'
        )),
        lab('خالی فاصلہ', inp(H, 'bl', '1', 'n'))
      )
    ),
    el('div', { className: 'cd' },
      el('h3', {}, '🔤 فونٹ اور سائز'),
      el('div', { className: 'hd2' },
        lab('فونٹ منتخب کریں', sel('font', Object.entries(FONTS).map(([k, v]) => [k, v[0]]), 'j')),
        lab('فونٹ سائز (14 سے 40 تک)', sel('fs', fontSizes, '18'))
      )
    ),
    el('div', { className: 'cd' },
      el('h3', {}, '🌳 شجرہ وراثت'),
      card(S.R, 1, null)
    ),
    witnessCard()
  );
  upd();
}

function upd() {
  try { localStorage.setItem('shajra_v8', JSON.stringify(S)); } catch(e){}
  render();
}

/* ---- Layout & Canvas Calculation ---- */
const FONTS = {
  j: ['جمیل نوری نستعلیق', '"Jameel Noori Nastaleeq","Jameel Noori Nastaliq","Noto Nastaliq Urdu",serif'],
  a: ['الوی نستعلیق', '"Alvi Nastaleeq","Noto Nastaliq Urdu",serif'],
  n: ['نوٹو نستعلیق', '"Noto Nastaliq Urdu",serif']
};

const fam = () => (FONTS[S.H.font] || FONTS.j)[1];
const fsz = () => +S.H.fs || 18;
const cv = document.createElement('canvas').getContext('2d');
const tw = t => {
  cv.font = fsz() + 'px ' + fam();
  return cv.measureText(t || '').width;
};

const G = 24, PT = 115;

function kind(p, r) {
  if (p.g === 'm') return 'm';
  if (r) return 'l';
  if (p.sp.length || p.ch.length) return 'mt';
  return 't';
}

const bw = (k, t) => {
  if (k === 'm') return Math.max(76, tw(t) + 20);
  if (k === 't') return Math.max(74, tw(t) + 20);
  return Math.max(110, tw(t) + 40);
};

function getSpouseWidths(p) {
  let rW = 0, lW = 0;
  p.sp.forEach((s, idx) => {
    const isFemale = (p.g === 'm');
    const shapeK = isFemale ? 'l' : 'm';
    const q = bw(shapeK, s.n);
    const toRight = (p.g === 'm') ? (idx % 2 === 0) : (idx % 2 === 1);
    if (toRight) rW += G + q;
    else lW += G + q;
  });
  return { rW, lW };
}

function lay(p, r) {
  p._k = kind(p, r);
  p._w = bw(p._k, p.n);

  const { rW, lW } = getSpouseWidths(p);
  p._spR = rW;
  p._spL = lW;

  p.ch.forEach(c => lay(c, 0));

  const chSum = p.ch.reduce((a, c) => a + c._W, 0);
  p._c = chSum;

  const halfW = p._w / 2;
  const selfExtR = halfW + p._spR;
  const selfExtL = halfW + p._spL;

  if (p.ch.length === 0) {
    p._extR = selfExtR;
    p._extL = selfExtL;
    p._W = p._extR + p._extL + 16;
    p._anchor = p._extR + 8;
  } else {
    const halfCh = chSum / 2;
    p._extR = Math.max(selfExtR, halfCh);
    p._extL = Math.max(selfExtL, halfCh);
    p._W = p._extR + p._extL + 16;
    p._anchor = p._extR + 8;
  }
}

const dep = p => p.ch.length ? 1 + Math.max(...p.ch.map(dep)) : 0;
const tp = (k, cy) => cy - (k === 'm' ? 16 : (k === 'mt' ? 24 : (k === 't' ? 24 : 26)));

/* ---- Drawing Functions ---- */
let o;
const ln = (a, b, c, d) => o.push(`<path d="M${a} ${b}L${c} ${d}"/>`);
const nm = (x, y, t) => o.push(`<text class="nm" x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central">${esc(t)}</text>`);

function shape(k, cx, cy, w, t, mirror=false) {
  if (k === 'm') {
    nm(cx, cy, t);
    return;
  }
  if (k === 't') {
    o.push(`<path d="M${cx-w/2} ${cy+24}L${cx} ${cy-24}L${cx+w/2} ${cy+24}"/>`);
    nm(cx, cy + 10, t);
    return;
  }
  if (k === 'mt') {
    // بیٹی کی چھوٹی تکون اور نیچے پان کا پتہ - متناسب فاصلے کے ساتھ
    o.push(`<path d="M${cx-16} ${cy-16}L${cx} ${cy-28}L${cx+16} ${cy-16}"/>`);
    ln(cx, cy-16, cx, cy-18);
    const l = cx - w / 2;
    o.push(`<path d="M${l} ${cy}C${l} ${cy-32} ${l+w*.55} ${cy-26} ${l+w} ${cy}C${l+w*.55} ${cy+26} ${l} ${cy+32} ${l} ${cy}Z"/>`);
    nm(cx - w * .04, cy, t);
    return;
  }
  if (k === 'l') {
    const l = cx - w / 2;
    if (mirror) {
      const r = cx + w / 2;
      o.push(`<path d="M${r} ${cy}C${r} ${cy-34} ${r-w*.55} ${cy-28} ${l} ${cy}C${r-w*.55} ${cy+28} ${r} ${cy+34} ${r} ${cy}Z"/>`);
      nm(cx + w * .04, cy, t);
    } else {
      o.push(`<path d="M${l} ${cy}C${l} ${cy-34} ${l+w*.55} ${cy-28} ${l+w} ${cy}C${l+w*.55} ${cy+28} ${l} ${cy+34} ${l} ${cy}Z"/>`);
      nm(cx - w * .04, cy, t);
    }
  }
}

function draw(p, x0, d, Y0) {
  const cx = x0 + p._W - p._anchor;
  const cy = Y0 + d * PT;
  const k = p._k, w = p._w;
  shape(k, cx, cy, w, p.n, false);

  let er = cx + w / 2;
  let eL = cx - w / 2;

  p.sp.forEach((s, idx) => {
    const isFemale = (p.g === 'm');
    const shapeK = isFemale ? 'l' : 'm';
    const q = bw(shapeK, s.n);
    const toRight = (p.g === 'm') ? (idx % 2 === 0) : (idx % 2 === 1);

    if (toRight) {
      const c = er + G + q / 2;
      ln(er, cy, c - q / 2, cy);
      shape(shapeK, c, cy, q, s.n, false);
      er = c + q / 2;
    } else {
      const c = eL - G - q / 2;
      ln(c + q / 2, cy, eL, cy);
      shape(shapeK, c, cy, q, s.n, isFemale ? true : false);
      eL = c - q / 2;
    }
  });

  if (p.ch.length) {
    const bus = cy + 62;
    const y0 = (k === 'm' ? cy + 18 : (k === 't' ? cy + 24 : cy + 26));
    const xs = [];
    
    let xr = cx + p._c / 2;
    const drawOrder = [...p.ch].reverse();
    drawOrder.forEach(c => {
      xr -= c._W;
      xs.push(draw(c, xr, d + 1, Y0));
    });

    ln(cx, y0, cx, bus);
    ln(Math.min(...xs), bus, Math.max(...xs), bus);
    drawOrder.forEach((c, i) => ln(xs[i], bus, xs[i], tp(c._k, bus + 53)));
  }
  return cx;
}

function render() {
  const { H, R, W } = S;
  o = [];
  lay(R, 1);

  // والدین (اسلم اور خادمہ) کا درست حساب اور سینٹر الائنمنٹ
  const hasPar = !!(R.fa || R.mo);
  let par = null;
  if (hasPar) {
    par = { g: 'm', n: R.fa, sp: R.mo ? [{ n: R.mo }] : [], ch: [] };
    lay(par, 0);
  }

  const Wt = Math.max(R._W, par ? par._W : 0);
  const ry = 34 + (hasPar ? 95 : 0);
  const Ht = ry + dep(R) * PT + 85;

  // متوفی کو شجرہ میں سینٹر ڈرا کرنا
  const rootCx = draw(R, (Wt - R._W) / 2, 0, ry);

  // والدین کو عین متوفی کے اوپر بالکل سیدھ میں ڈرا کرنا
  if (par) {
    const parX0 = rootCx - (par._W - par._anchor);
    draw(par, parX0, 0, 34);
    ln(rootCx, 34 + 18, rootCx, tp(R._k, ry));
  }

  // شوہر یا والد کا نام فیچ کرنا
  let relationString = '';
  if (R.g === 'f') {
    const husband = (R.sp && R.sp[0] && R.sp[0].n) ? R.sp[0].n.trim() : '';
    if (husband) relationString = `زوجہ ${husband}`;
    else if (R.fa) relationString = `دختر ${R.fa.trim()}`;
  } else {
    if (R.fa) relationString = `ولد ${R.fa.trim()}`;
  }

  const mutawaffaLabel = R.g === 'f' ? 'متوفیہ' : 'متوفی';
  const gt = `شجرہ نسب حسب گفتہ ${H.gn || '________'} ${H.rel || 'بیٹا'} ${mutawaffaLabel} ${R.n || '________'} ${relationString} مرتب کیا گیا`.replace(/\s+/g, ' ');

  const sheet = $('#sheet');
  sheet.style.setProperty('--sf', fam());
  sheet.style.setProperty('--fs', fsz() + 'px');
  sheet.style.setProperty('--wgap', (H.wgap || 30) + 'px');

  // ایک ہی سطر میں عمودی سینٹر ہیڈنگ بمعہ مناسب گیپ
  const headerHtml = H.sh ? `
    <div class="single-heading-row">
      <div class="item">وراثت نمبر:&nbsp;<b>${esc(H.vn) || '______'}</b></div>
      <div class="item">موضع / چک نمبر:&nbsp;<b>${esc(H.mz) || '______'}</b></div>
      <div class="item">${esc(gt)}</div>
    </div>
  ` : '';

  // گواہان و تصدیق کنندگان (بولڈ بالکل ختم، یکساں فونٹ)
  let witnessHtml = '';
  if (W && W.length) {
    witnessHtml = `
      <div class="witness-box">
        ${W.map(w => w.n ? `
          <div class="wit-row">
            <div class="wit-top">
              <span class="wit-name">${esc(w.n)}</span>
              <span class="wit-role">${esc(w.r)}</span>
            </div>
            <div class="wit-underline"></div>
            <div class="wit-cnic">${esc(w.c)}</div>
          </div>
        ` : '').join('')}
      </div>
    `;
  }

  sheet.innerHTML = headerHtml + `<div style="height:${(+H.bl || 0) * 20}px"></div><div id="tw"></div>` + witnessHtml;

  const used = [...sheet.children].filter(c => c.id !== 'tw').reduce((a, c) => a + c.offsetHeight, 0);
  const s = Math.min(1, 768 / (Wt + 20), (1296 - used - 8) / Ht);
  $('#tw').innerHTML = `<svg width="${(Wt + 20) * s}" height="${Ht * s}" viewBox="-10 0 ${Wt + 20} ${Ht}">${o.join('')}</svg>`;
}

$('#pr').onclick = () => print();
$('#nw').onclick = () => { S = BLANK(); build(); };
$('#ex').onclick = () => { S = SAMPLE(); build(); };

if (document.fonts) document.fonts.ready.then(render);
build();
</script>
</body>
</html>
